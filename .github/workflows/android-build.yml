name: Android Build

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'assets/**'
            - 'app.json'
            - 'eas.json'
            - 'package.json'

permissions:
    contents: read

jobs:
    build:
        name: Build APK with EAS
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Setup Expo and EAS
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: Install dependencies
              run: npm ci

            - name: Validate Expo config
              run: npx expo config --type public

            - name: Start Android build
              run: >
                  eas build
                  --platform android
                  --profile production
                  --non-interactive
                  --no-wait
